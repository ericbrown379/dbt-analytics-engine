version: 2

models:
  - name: fct_orders
    description: Analytical orders data.
    columns:
      - name: order_id
        description: Primary key of the orders.
      - name: customer_id
        description: Foreign key of customer_id at dim_customers.
      - name: order_date
        description: Date that order was placed by the customer.
      - name: cash_amount
        description: Total amount paid in cash by the customer with "success" payment status.
      - name: credit_amount
        description: Total amount paid in credit by the customer with "success" payment status.
      - name: total_amount
        description: Total amount paid by the customer with "success" payment status.
      - name: is_order_completed
        description: "{{ doc('is_order_completed_docblock') }}"

  - name: dim_customers
    description: Customer data. It allows you to analyze customers' perspective linked facts.
    columns:
      - name: customer_id
        description: Primary key of the customers.
      - name: first_name
        description: Customer first name.
      - name: last_name
        description: Customer last name.

semantic_models:
  - name: orders
    description: |
      Order fact table. This table is at the grain of one row per order.
    model: "ref('fct_orders')"
    entities:
      - name: order_id
        type: primary
      - name: customer
        type: foreign
        expr: customer_id
    dimensions:
      - name: order_date
        type: time
        type_params:
          time_granularity: day
      - name: is_order_completed
        type: categorical
    measures:
      - name: total_amount
        description: Total amount paid by the customer with successful payment status.
        agg: sum
        agg_time_dimension: order_date
      - name: order_count
        expr: "1"
        agg: sum
        agg_time_dimension: order_date
      - name: cash_amount
        description: Total amount paid in cash by the customer with successful payment status.
        agg: sum
        agg_time_dimension: order_date
      - name: customers_with_orders
        description: Distinct count of customers placing orders.
        expr: customer_id
        agg: count_distinct
        agg_time_dimension: order_date

metrics:
  - name: order_total
    description: Sum of total order amount.
    label: Order Total
    type: simple
    type_params:
      measure: total_amount

  - name: order_count
    description: Count of orders.
    label: Orders
    type: simple
    type_params:
      measure: order_count

  - name: completed_orders
    description: Count of orders that were delivered.
    label: Delivered Orders
    type: simple
    type_params:
      measure: order_count
    filter: |
      {{ Dimension('order_id__is_order_completed') }} = true